    <circle cx="0" cy="-82" r="6" fill="#ff0000"/>
    <!-- Pillars of Hercules -->
    <rect x="-65" y="-30" width="12" height="70" fill="#c0c0c0" rx="3"/>
    <rect x="53" y="-30" width="12" height="70" fill="#c0c0c0" rx="3"/>
    <path fill="#aa151b" d="M-72, -5 h26 v8 h-26 z M46, -5 h26 v8 h-26 z"/>

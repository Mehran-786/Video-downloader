    <path d="M-36,10 h36 v30 c0,10 10,20 20,25 h-20 v-25 z" fill="#f1bf00"/>
    <path d="M0,10 h36 v25 c-10,5 -20,10 -20,20 v-20 h-16 z" fill="#aa151b"/>
